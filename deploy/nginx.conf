# 焚炎异录 · Nginx 站点配置
# 用法：改好下面两处 TODO 后，放到 /etc/nginx/sites-available/doupo-idle
# 再软链到 sites-enabled 并 reload：
#   sudo ln -s /etc/nginx/sites-available/doupo-idle /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # TODO: 换成你自己的域名，没有域名就用服务器公网 IP
    server_name your-domain.example.com;

    # TODO: 换成你实际部署的路径。deploy.sh 会把每次构建放到 releases/<时间戳>/
    # 再把 current 软链原子切到最新版本，root 只认 current 这一层，不用改
    root /var/www/doupo-idle/current;
    index index.html;

    # 纯前端 SPA 必需：任何路径都兜底回 index.html，
    # 否则浏览器直接访问/刷新非根路径会 404（本项目虽然只用 tab 状态没有路由，
    # 但保留这条规则无副作用，且以后如果加路由不用再改配置）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 文件名的静态资源（vite build 产物）可以放心长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 本身不要缓存，否则更新代码后玩家还在用旧版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 素材体积较大（角色立绘/怪物/场景美术，dist/ 目前约 117MB），
    # 如果后续用户量上来了考虑上 CDN 或者对图片做二次压缩/WebP 转换
    client_max_body_size 0;
}

# 有域名并想要 HTTPS（强烈建议，浏览器现在对 http 站点会有安全提示）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.example.com
# certbot 会自动改写这个文件加上 443 server block 和证书路径，跑一次就够了
